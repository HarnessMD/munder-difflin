name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

jobs:
  typecheck:
    name: Typecheck
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (node + web)
        run: npm run typecheck
      # Release gate: every advertised download link and docs version string must
      # match package.json. A version left behind in RELEASE.md / docs turns the
      # download buttons into 404s the moment the next release ships — this catches
      # it on the release branch, before a tag, instead of on launch day.
      - name: Release links consistent
        run: npm run check:links
      # Locale shape only: key trees, {{placeholders}} and <tags> match en.json,
      # and zh-TW.json is in step with zh-CN.json (passes when zh-TW.json does
      # not exist). Deliberately NOT the whole test/*.test.cjs suite.
      - name: i18n tests
        run: node --test test/i18n-god-name.test.cjs test/arabic-ui.test.cjs test/i18n-locale-parity.test.cjs
      - name: zh-TW in step with zh-CN
        run: npm run i18n:fill-zh-tw -- --check

  build:
    name: Build
    runs-on: macos-latest
    # Build exercises the native node-pty rebuild; allowed to fail without blocking.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
