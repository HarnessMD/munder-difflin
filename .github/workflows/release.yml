name: Release

# Releases are source only. A pushed v* tag becomes a GitHub Release whose body
# is RELEASE.md, and GitHub attaches its own source archives. Nothing is built,
# signed or uploaded here, so the job needs no secrets.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE.md
          # A tag with a suffix (v0.6.1-rc.1, v0.6.1-beta.2) publishes as a
          # prerelease. GitHub leaves prereleases out of releases/latest, the one
          # endpoint the in-app notice polls, so an rc never tells installed
          # copies it exists. A clean vX.Y.Z tag becomes the latest release.
          prerelease: ${{ contains(github.ref_name, '-') }}
