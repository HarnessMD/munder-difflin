<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Stapler</title>
    <!-- The puck talks to nothing but main over the bridge: no connect-src at
         all. Audio is captured here and handed to main as bytes; main is the
         only side that ever reaches the transcriber. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' blob: mediastream:;" />
    <style>
      html, body, #root { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/puck/main.tsx"></script>
  </body>
</html>
